<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; background: #f9fafb; padding: 24px;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 640px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb;">
      <tr>
        <td style="padding: 24px; border-bottom: 4px solid #16a34a;">
          <h1 style="margin: 0; font-size: 22px; color: #166534;">Device Recovered</h1>
        </td>
      </tr>
      <tr>
        <td style="padding: 24px;">
          <p style="margin-top: 0;">A previously offline device is reporting heartbeats again.</p>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="8" style="border-collapse: collapse;">
            <tr><td><strong>Device name</strong></td><td>{{deviceName}}</td></tr>
            <tr><td><strong>Device ID</strong></td><td>{{deviceId}}</td></tr>
            <tr><td><strong>Recovered at</strong></td><td>{{resolvedAt}}</td></tr>
            <tr><td><strong>Alert duration</strong></td><td>{{duration}}</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
