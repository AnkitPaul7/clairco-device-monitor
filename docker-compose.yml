services:
  mongo:
    image: mongo:6
    container_name: clairco-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - clairco-network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: clairco-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - clairco-network

  backend:
    build: ./backend
    container_name: clairco-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/clairco_monitor
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: devices/+/telemetry
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      API_KEY: ${API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - mosquitto
    networks:
      - clairco-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000
        REACT_APP_WS_URL: ws://localhost:5000
        REACT_APP_API_KEY: ${API_KEY:-}
    container_name: clairco-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - clairco-network

networks:
  clairco-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
